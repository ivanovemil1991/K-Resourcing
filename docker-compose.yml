# Runs the API next to a Redis server for the shared cover cache.
# TLS: put a PFX at certs/claims.pfx (see docs/SOLUTION.md, "HTTPS and certificates") and set Https__CertPassword.
# MongoDB and SQL Server are external: export Database__ClaimsMongoDb and Database__AuditSqlServer first.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  claims:
    build: .
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./certs:/https:ro
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: https://+:8443;http://+:8080
      ASPNETCORE_HTTPS_PORT: "8443"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/claims.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${Https__CertPassword:?set the password of certs/claims.pfx}
      Redis__ConnectionString: redis:6379
      Database__ClaimsMongoDb: ${Database__ClaimsMongoDb:?set the MongoDB replica set connection string}
      Database__AuditSqlServer: ${Database__AuditSqlServer:?set the SQL Server connection string}
      Authentication__Authority: ${Authentication__Authority:?set the Entra authority}
      Authentication__Audience: ${Authentication__Audience:?set the API audience}
      Encryption__Key: ${Encryption__Key:?set a base64 32 byte key, e.g. from Key Vault}
